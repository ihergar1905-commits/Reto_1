<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caza al Bug - Misión 1</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <h1>🐛 Juego: Caza al Bug</h1>
  <p>Haz clic en el botón de "Iniciar". Intenta hacer clic en el bug todas las veces que puedas antes de que se acabe el tiempo.</p>

  <!-- Marcadores simples -->
  <div>
    <p>Puntos: <strong id="score">0</strong></p>
    <p>Tiempo restante: <strong id="timer">15</strong> segundos</p>
  </div>

  <!-- Botón de inicio -->
  <button type="button" id="startBtn">Iniciar Juego</button>

  <!-- Area de juego -->
  <div id="codeBoard">
    <button type="button" id="bug" class="hidden">🐛</button>
  </div>

  <!-- Mensajes finales -->
  <p id="statusMessage"></p>

</body>
</html>
