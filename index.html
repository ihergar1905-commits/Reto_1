<!DOCTYPE html>
<html lang="es">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El oráculo de los números</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>

    <div class="juego">

        <h1>El oráculo de los números</h1>

        <p>Adivina el número secreto</p>
        <p>El número está entre <strong>1 y 100</strong></p>

        <label for="numero">Introduce tu número:</label>

        <div>
            <input type="number" id="numero" min="1" max="100">
            <button id="boton">Consultar</button>
        </div>

        <p id="mensaje"></p>

        <p>Intentos: <span id="intentos">0</span> / 7</p>

        <p id="historial"></p>

        <button id="nuevaPartida"> Nueva profecía</button>

    </div>

</body>

</html>
